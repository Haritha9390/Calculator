<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./calculator.css">
    <link rel="stylesheet" href="./style.css">
    <title>calculator</title>
</head>
<body>
    <center>
        <br>
        <br>
        <form id="calsi">
    <fieldset>
       <legend><b>Calculator</b></legend>
       
        <input id="display" type="button">
        <br>
        <br>
        <input class="c" type="button" value="AC"  onclick="calsi.display.value=''"> &nbsp; &nbsp; &nbsp;
       <input class="c" type="button" value="C"  onclick="calsi.display.value=calsi.display.value.substr(0,calsi.display.value.length-1)">&nbsp; &nbsp; &nbsp;
       <input class="c"  type="button" value="%"  onclick="calsi.display.value+='%'"> &nbsp; &nbsp; &nbsp;
       <input class="c" type="button" value="/"  onclick="calsi.display.value+='/'"> &nbsp; &nbsp; &nbsp;
       <br>
       
       <input class="c"  type="button" value="1"  onclick="calsi.display.value+='1'">&nbsp; &nbsp; &nbsp;
        <input class="c" type="button" value="2"  onclick="calsi.display.value+='2'"> &nbsp; &nbsp; &nbsp; 
        <input class="c" type="button" value="3"  onclick="calsi.display.value+='3'"> &nbsp; &nbsp; &nbsp;
        <input class="c" type="button" value="*"  onclick="calsi.display.value+='*'"> &nbsp; &nbsp; &nbsp;
        
        <br>
        <input class="c" type="button" value="4"  onclick="calsi.display.value+='4'"> &nbsp; &nbsp; &nbsp;
        <input class="c" type="button" value="5"  onclick="calsi.display.value+='5'"> &nbsp; &nbsp; &nbsp;
        <input class="c" type="button" value="6"  onclick="calsi.display.value+='6'"> &nbsp; &nbsp; &nbsp;
        <input class="c" type="button" value="-"  onclick="calsi.display.value+='-'"> &nbsp; &nbsp; &nbsp;
        <br>
        
        <input class="c" type="button" value="7"  onclick="calsi.display.value+='7'"> &nbsp; &nbsp; &nbsp;
        <input class="c" type="button" value="8"  onclick="calsi.display.value+='8'"> &nbsp; &nbsp; &nbsp;
        <input class="c" type="button" value="9"  onclick="calsi.display.value+='9'"> &nbsp; &nbsp; &nbsp;
        <input class="c" type="button" value="+"  onclick="calsi.display.value+='+'"> &nbsp; &nbsp; &nbsp;
        <br>
        
        <input class="c" type="button" value="00"  onclick="calsi.display.value+='00'"> &nbsp; &nbsp; &nbsp;
        <input class="c" type="button" value="0"   onclick="calsi.display.value+='0'"> &nbsp; &nbsp; &nbsp;
        <input class="c" type="button" value="."   onclick="calsi.display.value+='.'"> &nbsp; &nbsp; &nbsp;
        <input class="c" type="button" value="="  onclick="calsi.display.value=eval(calsi.display.value)"> &nbsp; &nbsp; &nbsp;
    </fieldset>
</form>
</center>
</body>
</html>
